name: Publish Digest Archive

# Rebuilds after every digest run, so today's stories are crawlable minutes
# after they hit the channel.
on:
  workflow_run:
    workflows: ['AI Digest']
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A failed digest run has nothing new to publish.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The digest workflow commits history.json back to the branch, so the
      # checkout has to be the state *after* that commit, not the SHA that
      # triggered the run.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Refuses to build an empty site rather than deindex every page we have.
      - name: Build site
        run: npm run site
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          CHANNEL_HANDLE: ${{ vars.CHANNEL_HANDLE }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
