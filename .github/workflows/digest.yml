name: AI Digest

on:
  schedule:
    # Yerevan is UTC+4 (no DST). 06:00 UTC = 10:00, 16:00 UTC = 20:00 Yerevan.
    - cron: '0 6,16 * * *'
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # needed to commit history.json back to the repo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Post digest
        run: npm start
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          SITE_URL: ${{ vars.SITE_URL || 'zromek.de' }}
          CHANNEL_HANDLE: ${{ vars.CHANNEL_HANDLE }}

      - name: Persist history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Conflict-proof persist: never merge/rebase history.json. Save our freshly
          # generated copy, hard-reset onto the very latest origin, re-apply our copy
          # as a single clean commit, and push — retrying only if the push itself
          # races another update. Our copy already holds origin's entries plus today's,
          # and appendHistory dedupes by date, so re-applying loses nothing.
          cp history.json "${RUNNER_TEMP}/history.json"
          for i in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            cp "${RUNNER_TEMP}/history.json" history.json
            git add history.json
            if git diff --cached --quiet; then
              echo "No history change."
              exit 0
            fi
            git commit -q -m "chore: record daily digest in history [skip ci]"
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "History persisted."
              exit 0
            fi
            echo "Push raced with another update — retry ${i}/5"
            sleep $((RANDOM % 4 + 2))
          done
          echo "Could not persist history after 5 retries" >&2
          exit 1
